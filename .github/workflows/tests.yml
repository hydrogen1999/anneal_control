name: CPU correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,plots]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: python scripts/rebuild_evidence.py --check
      - run: python reports/paper_campaign_2026-09-18/reproduce.py --check
      - run: python reports/paper_budget_validation_2026-09-18/reproduce.py --check
