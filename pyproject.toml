[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annealctrl"
version = "0.2.0"
description = "Config-driven data generation, training and audited evaluation for embedded Ising annealing control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "networkx>=3.0"]

[project.optional-dependencies]
ml = ["torch>=2.2"]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]
hardware = ["dwave-networkx>=0.8"]
all-cpu = ["torch>=2.2", "pytest>=8", "matplotlib>=3.8"]

[project.scripts]
annealctrl = "annealctrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
